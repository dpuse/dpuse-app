<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="dPu logo">
  <!-- background (optional, remove if not needed) -->
  <rect x="4" y="4" width="152" height="112" rx="20" fill="none" />

  <g fill="none" stroke-width="10" stroke-linecap="butt" stroke-linejoin="round">
    <!-- d (green) -->
    <path
      stroke="rgb(114, 155, 27)"
      d="
        M 30 90
        L 30 30

        M 30 50
        L 50 50
        L 50 70
        L 30 70
      "
    />

    <!-- P (yellow) -->
    <path
      stroke="rgb(235, 187, 72)"
      d="
        M 80 90
        L 80 30

        M 80 30
        L 105 30
        L 105 55
        L 80 55
      "
    />

    <!-- u (blue) -->
    <path
      stroke="rgb(40, 120, 200)"
      d="
        M 120 50
        L 120 80
        Q 120 90 110 90
        Q 100 90 100 80
        L 100 50
      "
    />
  </g>
</svg>