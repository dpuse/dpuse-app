<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>Viewport test</title>
        <style>
            html,
            body {
                margin: 0;
                background: #fff;
            }
            /* Same construction as '#app': if this green does not run under the Safari bottom bar, the cause is the
               browser, not the app's layout. */
            #box {
                height: 100lvh;
                width: 100lvw;
                background: #bbf7d0;
                box-sizing: border-box;
                font: 13px/1.5 ui-monospace, monospace;
                padding: 12px;
            }
            #edge {
                position: absolute;
                left: 0;
                right: 0;
                height: 40px;
                background: repeating-linear-gradient(45deg, #dc2626 0 8px, #991b1b 8px 16px);
                color: #fff;
                text-align: center;
                line-height: 40px;
            }
            #readout {
                white-space: pre;
            }
        </style>
    </head>
    <body>
        <div id="box">
            <div id="readout">measuring…</div>
            <!-- Sits at the very bottom of the 100lvh box: whatever covers this stripe is what is cutting the app off. -->
            <div id="edge" style="top: calc(100lvh - 40px)">BOTTOM OF 100lvh</div>
        </div>
        <script>
            function probe(name) {
                const el = document.createElement('div');
                el.style.cssText = 'position:absolute;visibility:hidden;height:' + name + ';';
                document.body.append(el);
                const h = el.getBoundingClientRect().height;
                el.remove();
                return Math.round(h);
            }
            function read() {
                const vv = window.visualViewport;
                const probeEl = document.createElement('div');
                probeEl.style.cssText = 'position:fixed;bottom:0;height:env(safe-area-inset-bottom);';
                document.body.append(probeEl);
                const safeBottom = Math.round(probeEl.getBoundingClientRect().height);
                probeEl.remove();
                document.getElementById('readout').textContent = [
                    'standalone PWA : ' + matchMedia('(display-mode: standalone)').matches,
                    'window.innerHeight : ' + window.innerHeight,
                    '100lvh : ' + probe('100lvh'),
                    '100dvh : ' + probe('100dvh'),
                    '100svh : ' + probe('100svh'),
                    'visualViewport.height : ' + (vv ? Math.round(vv.height) : 'n/a'),
                    'visualViewport.offsetTop: ' + (vv ? Math.round(vv.offsetTop) : 'n/a'),
                    'visualViewport.scale : ' + (vv ? vv.scale : 'n/a'),
                    'safe-area-inset-bottom : ' + safeBottom,
                    'documentElement.scrollH : ' + document.documentElement.scrollHeight,
                    '',
                    'If the red stripe is fully visible, 100lvh is NOT',
                    'reaching behind the bar. If it is hidden or partly',
                    'covered by the bar, the app layout is already correct.'
                ].join('\n');
            }
            read();
            window.visualViewport?.addEventListener('resize', read);
            window.visualViewport?.addEventListener('scroll', read);
            window.addEventListener('resize', read);
        </script>
    </body>
</html>
