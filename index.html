<!doctype html>
<html dir="ltr" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />

        <title>DPU Workbench</title>
        <meta name="description" content="The Data Positioning and Usage workbench." />
        <link rel="icon" href="/favicon.ico" />

        <link rel="preconnect" href="https://www.datapos.app" />

        <style>
            html {
                background-color: #020617;
                color: #e5e7eb;
            }

            @media (prefers-color-scheme: light) {
                html {
                    background-color: #ffffff;
                    color: #020617;
                }
            }
        </style>

        <script>
            (function () {
                try {
                    const storageKey = 'vueuse-color-scheme';
                    const stored = localStorage.getItem(storageKey) || 'auto';
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const theme = stored === 'auto' ? (prefersDark ? 'dark' : 'light') : stored;
                    const root = document.documentElement;
                    if (theme === 'dark') {
                        root.classList.add('dark');
                    } else {
                        root.classList.remove('dark');
                    }
                } catch {
                    // Fail silently, VueUse will handle theme later.
                }
            })();
        </script>

        <!-- Cronitor RUM -->
        <script async src="https://rum.cronitor.io/script.js"></script>
        <script>
            window.cronitor =
                window.cronitor ||
                function () {
                    (window.cronitor.q = window.cronitor.q || []).push(arguments);
                };
            cronitor('config', { clientKey: 'a19996d0f3873b0a3e7f8921f7145a2e' });
        </script>
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
