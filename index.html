<!doctype html>
<html dir="ltr" lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark light" />

        <title>DPUse App</title>
        <meta name="description" content="Data Positioning & Usage workbench." />

        <link rel="preconnect" href="https://static.cloudflareinsights.com" />
        <link rel="preconnect" href="https://auth.datapos.app" />
        <link rel="preconnect" href="https://eu.i.posthog.com" />

        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="DPUse" />

        <!-- NOTE: Following is white -->
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <!-- NOTE: Following is zinc-950 -->
        <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />

        <link rel="manifest" href="/manifest.webmanifest" />

        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
        <!-- <link rel="shortcut icon" href="/favicon.ico" /> -->

        <!-- Styles for ensuring prior appearance is restored on load. Stops flashing. -->
        <!-- CSP requires style-src hash in production for content of following style block. See console error message for required hash. -->
        <style>
            html {
                background-color: #09090b; /* zinc-950 */
                color: #d4d4d8; /* zinc-300 */
            }

            @media (prefers-color-scheme: light) {
                html {
                    background-color: #ffffff; /* white */
                    color: #27272a; /* zinc-800 */
                }
            }
        </style>

        <!-- Ensure prior appearance is restored on load. Stops flashing. -->
        <!-- CSP requires script-src hash in production for content of following script block. See console error message for required hash. -->
        <script>
            (function () {
                try {
                    const storageKey = 'dpuse-appearance';
                    const stored = localStorage.getItem(storageKey) || 'auto';
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const theme = stored === 'auto' ? (prefersDark ? 'dark' : 'light') : stored;
                    const root = document.documentElement;
                    if (theme === 'dark') {
                        root.classList.add('dark');
                    } else {
                        root.classList.remove('dark');
                    }
                    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                        const stored = localStorage.getItem(storageKey) || 'auto';
                        if (stored === 'auto') root.classList.toggle('dark', e.matches);
                    });
                } catch {
                    // Fail silently, will be handled later.
                }
            })();
        </script>
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
