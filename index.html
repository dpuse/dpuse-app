        <title>DPU Workbench</title>
        <meta name="description" content="The Data Positioning and Usage workbench." />

        <link rel="preconnect" href="https://www.datapos.app" />

        <link rel="preconnect" href="https://743f845f-9767-4da0-8f7f-c29c46f12f0b.hanko.io" />

        <style>
            html {
                background-color: #020617;
                color: #e5e7eb;
            }

            @media (prefers-color-scheme: light) {
                html {
                    background-color: #ffffff;
                    color: #020617;
                }
            }
        </style>

        <script>
            (function () {
                try {
                    const storageKey = 'vueuse-color-scheme';
                    const stored = localStorage.getItem(storageKey) || 'auto';
                    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const theme = stored === 'auto' ? (prefersDark ? 'dark' : 'light') : stored;
                    const root = document.documentElement;
                    if (theme === 'dark') {
                        root.classList.add('dark');
                    } else {
                        root.classList.remove('dark');
                    }
                } catch {
                    // Fail silently, VueUse will handle theme later.
                }
            })();
        </script>
    </head>

    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
